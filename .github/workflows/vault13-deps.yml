name: Fallout Vault 13 remaining Gradle dependencies on: workflow_dispatch: push: paths: - '.github/workflows/vault13-deps.yml' jobs: download: runs-on: ubuntu-latest steps: - uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - uses: gradle/actions/setup-gradle@v4 with: gradle-version: '8.2' cache-disabled: true - name: Seed plugin and library dependencies shell: bash run: | mkdir -p seed cat > seed/settings.gradle <<'GRADLE' pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } rootProject.name = 'vault13-dependency-seed' GRADLE cat > seed/build.gradle <<'GRADLE' plugins { id 'com.android.application' version '8.2.0' apply false id 'org.jetbrains.kotlin.android' version '1.9.20' apply false } configurations { godotLibraries } repositories { google(); mavenCentral(); gradlePluginPortal() } dependencies { godotLibraries 'androidx.fragment:fragment:1.6.1' godotLibraries 'androidx.core:core-splashscreen:1.0.1' } tasks.register('downloadGodotLibraries') { doLast { configurations.godotLibraries.resolve() } } GRADLE gradle --no-daemon -p seed downloadGodotLibraries - name: Verify offline resolution shell: bash run: gradle --offline --no-daemon -p seed downloadGodotLibraries - name: Package cache shell: bash run: | cd "$HOME/.gradle/caches" zip -qr "$GITHUB_WORKSPACE/Vault13-Gradle-Dependencies.zip" modules-2 -x '*.lock' '*/gc.properties' unzip -tqq "$GITHUB_WORKSPACE/Vault13-Gradle-Dependencies.zip" - uses: actions/upload-artifact@v4 with: name: Vault13-Gradle-Dependencies path: Vault13-Gradle-Dependencies.zip if-no-files-found: error
