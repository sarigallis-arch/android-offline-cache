name: Vault 13 Gradle Dependencies

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vault13-deps.yml'

jobs:
  download-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Gradle project
        run: |
          mkdir -p cache-project
          cat > cache-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'vault13-cache'
          EOF

          cat > cache-project/build.gradle <<'EOF'
          plugins {
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
              id 'com.android.application' version '8.2.0' apply false
          }
          configurations {
              offlineLibraries
          }
          dependencies {
              offlineLibraries 'androidx.core:core:1.12.0'
              offlineLibraries 'androidx.appcompat:appcompat:1.6.1'
              offlineLibraries 'androidx.activity:activity:1.8.1'
              offlineLibraries 'androidx.fragment:fragment:1.6.2'
          }
          tasks.register('downloadLibraries') {
              doLast {
                  configurations.offlineLibraries.resolve()
              }
          }
          EOF

      - name: Download dependencies
        run: |
          gradle --no-daemon -p cache-project downloadLibraries
          gradle --offline --no-daemon -p cache-project downloadLibraries

      - name: Package offline cache
        run: |
          cd ~/.gradle/caches
          zip -qr "$GITHUB_WORKSPACE/Vault13-Gradle-Dependencies.zip" modules-2 -x '*.lock' '*/gc.properties'

      - name: Upload cache
        uses: actions/upload-artifact@v4
        with:
          name: Vault13-Gradle-Dependencies
          path: Vault13-Gradle-Dependencies.zip
          retention-days: 7
